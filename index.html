<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake & Ladder Game</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="container">

    <h1>🐍 Snake & Ladder 🪜</h1>

    <div class="game-info">
        <h2 id="turn">Player 1's Turn</h2>

        <div class="players">
            <p>🔴 Player 1: <span id="position1">1</span></p>
            <p>🔵 Player 2: <span id="position2">1</span></p>
        </div>

        <p class="dice">
            Dice: <span id="dice">-</span>
        </p>

        <button id="rollButton">🎲 Roll Dice</button>
        <button id="restartButton">🔄 Restart</button>

        <p id="message">Player 1, roll the dice!</p>
    </div>

    <div id="board" class="board"></div>

</div>

<script src="script.js"></script>
```

</body>
</html>
